name: Daily Fork Top 10 GitHub Repos

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  fork-top-repos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Top 10 GitHub Repositories and Fork
        env:
          GH_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          echo "Fetching top 10 most starred GitHub repositories..."
          
          # Get top 10 repositories sorted by stars
          REPOS=$(curl -s "https://api.github.com/search/repositories?q=stars:>1&sort=stars&order=desc&per_page=10" | jq -r '.items[] | "\(.full_name)"')
          
          echo "Top 10 repositories found:"
          echo "$REPOS"
          echo ""
          
          # Fork each repository
          for repo in $REPOS; do
            echo "Attempting to fork: $repo"
            
            # Check if already forked by checking if the repo exists in user's account
            REPO_NAME=$(echo "$repo" | cut -d'/' -f2)
            
            # Try to fork the repository
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$repo/forks")
            
            # Check if fork was successful
            if echo "$RESPONSE" | jq -e '.id' > /dev/null 2>&1; then
              FORK_URL=$(echo "$RESPONSE" | jq -r '.html_url')
              echo "✅ Successfully forked $repo"
              echo "   Fork URL: $FORK_URL"
            elif echo "$RESPONSE" | jq -e '.message' | grep -q "already exists"; then
              echo "ℹ️  Fork of $repo already exists in your account"
            else
              ERROR_MSG=$(echo "$RESPONSE" | jq -r '.message // "Unknown error"')
              echo "❌ Failed to fork $repo: $ERROR_MSG"
            fi
            
            echo ""
            # Add a small delay to avoid rate limiting
            sleep 2
          done
          
          echo "Fork process completed!"
